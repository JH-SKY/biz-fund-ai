services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: biz-fund-ai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: biz_fund_ai
      POSTGRES_USER: biz_user
      POSTGRES_PASSWORD: biz_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U biz_user -d biz_fund_ai"]
      interval: 10s
      timeout: 5s
      retries: 10

  elasticsearch:
    build:
      context: .
      dockerfile: docker/elasticsearch/Dockerfile
    container_name: biz-fund-ai-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20

  app:
    image: python:3.12-slim
    container_name: biz-fund-ai-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /workspace/backend
    volumes:
      - ./:/workspace
    command: >
      sh -c "
      pip install --no-cache-dir uv &&
      uv sync --frozen --dev &&
      uv run alembic upgrade head &&
      uv run uvicorn src.app.main:app --host 0.0.0.0 --port 8000
      "
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://biz_user:biz_password@postgres:5432/biz_fund_ai
      SQL_ECHO: "false"
      FRONTEND_ORIGINS: http://localhost:3000
      RUN_SCHEDULER: "true"
      LANGGRAPH_CHECKPOINTER_BACKEND: postgres
      LANGGRAPH_CHECKPOINTER_DSN: postgresql://biz_user:biz_password@postgres:5432/biz_fund_ai
      ADMIN_JWT_SECRET: change-this-admin-secret
      USER_JWT_SECRET: change-this-user-secret
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      NTS_API_KEY: ${NTS_API_KEY:-}
      BIZINFO_API_KEY: ${BIZINFO_API_KEY:-}
      ELASTICSEARCH_ENABLED: ${ELASTICSEARCH_ENABLED:-true}
      ELASTICSEARCH_URL: ${ELASTICSEARCH_URL:-http://elasticsearch:9200}
      ELASTICSEARCH_INDEX_POLICY_CHUNKS: ${ELASTICSEARCH_INDEX_POLICY_CHUNKS:-policy_chunks_sparse}
      ELASTICSEARCH_REQUEST_TIMEOUT: ${ELASTICSEARCH_REQUEST_TIMEOUT:-5}
    ports:
      - "8000:8000"

volumes:
  postgres_data:
