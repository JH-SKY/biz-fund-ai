services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: biz-fund-ai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: biz_fund_ai
      POSTGRES_USER: biz_user
      POSTGRES_PASSWORD: biz_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U biz_user -d biz_fund_ai"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    image: python:3.12-slim
    container_name: biz-fund-ai-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /workspace/backend
    volumes:
      - ./:/workspace
    command: >
      sh -c "
      pip install --no-cache-dir uv &&
      uv sync --frozen --dev &&
      uv run alembic upgrade head &&
      uv run uvicorn src.app.main:app --host 0.0.0.0 --port 8000
      "
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://biz_user:biz_password@postgres:5432/biz_fund_ai
      SQL_ECHO: "false"
      FRONTEND_ORIGINS: http://localhost:3000
      RUN_SCHEDULER: "true"
      LANGGRAPH_CHECKPOINTER_BACKEND: postgres
      LANGGRAPH_CHECKPOINTER_DSN: postgresql://biz_user:biz_password@postgres:5432/biz_fund_ai
      ADMIN_JWT_SECRET: change-this-admin-secret
      USER_JWT_SECRET: change-this-user-secret
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      NTS_API_KEY: ${NTS_API_KEY:-}
      BIZINFO_API_KEY: ${BIZINFO_API_KEY:-}
    ports:
      - "8000:8000"

volumes:
  postgres_data:
