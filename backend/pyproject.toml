[project]
name = "BIZ-FUND-AI"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "elasticsearch[async]>=8.15.1,<9.0.0",
    "fastapi-pagination>=0.15.11",
    "fastapi[standard]>=0.132.0",
    "httpx>=0.28.1",
    "langchain>=1.2.13",
    "langchain-openai>=1.1.12",
    "openai>=2.29.0",
    "pgvector>=0.3.6",
    "psycopg2-binary>=2.9.11",
    "pyjwt>=2.12.1",
    "apscheduler>=3.10.4",
    "olefile>=0.47",
    "pymupdf>=1.27.2.2",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "python-dotenv>=1.2.1",
    "sqlalchemy>=2.0.48",
    "langgraph>=1.1.3",
    "langgraph-checkpoint-postgres>=2.0.0",
    "beautifulsoup4>=4.14.3",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.7",
]

[tool.ruff]
exclude = [
    "migrations",
    "test_embed.py",
]

[tool.ruff.lint]
ignore = ["E402", "E712"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
